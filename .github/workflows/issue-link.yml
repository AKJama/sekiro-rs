name: Issue link

# A reminder, never a gate: the job always passes, and a missing link or template section
# gets the `needs-issue` label and one bot comment, edited in place and removed once fixed.
# Failing runs e-mailed the maintainer on every push, and drafts often come before their issue.
on:
  # Same-repo PRs run the PR's own copy of this file, so changes to it can be tried on their PR.
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]
  # Fork PRs get a read-only token under pull_request, so they run main's copy here instead.
  # It never checks out or runs the PR's code: it reads the body and main's template only.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]

permissions: { contents: read, issues: write, pull-requests: write }

concurrency:
  group: issue-link-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    # Title or base edits can't change the result; body edits and pushes can.
    # Each PR runs under one event only: pull_request_target for forks, pull_request otherwise.
    if: >-
      (github.event.action != 'edited' || github.event.changes.body != null)
      && ((github.event_name == 'pull_request_target')
        == (github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Check the issue link and template, then label and comment
        # A hiccup shows as a warning on the run, never as a failure e-mail.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.url }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'needs-issue') }}
        run: |
          set -uo pipefail
          problems=""
          problem() { problems+="$*"$'\n'; }

          references=$(printf '%s\n' "$PR_BODY" | grep -Eio '\b(Fixes|Closes|Resolves)[[:blank:]]+#[0-9]+\b')
          numbers=$(printf '%s\n' "$references" | grep -Eo '[0-9]+' | sort -u)
          if [[ -z "$references" ]]; then
            problem "Link the issue with a closing reference such as \`Fixes #123\` in the PR body."
          elif [[ $(wc -l <<< "$numbers") -ne 1 ]]; then
            problem "One issue per PR: this PR closes $(echo $numbers | sed 's/ /, #/g; s/^/#/'). Split it into one PR per issue."
          elif ! issue=$(gh api "repos/$GH_REPO/issues/$numbers"); then
            problem "Could not read issue #$numbers."
          elif jq -e 'has("pull_request")' <<< "$issue" > /dev/null; then
            problem "#$numbers is a PR, not an issue."
          # A run that starts after a fast merge sees the issue the merge just closed.
          elif ! jq -e '.state == "open"' <<< "$issue" > /dev/null && [[ $(gh api "$PR_URL" --jq .merged) != true ]]; then
            problem "Issue #$numbers must be open."
          fi

          # Drafts are claims and may be empty; the template is checked once the PR is ready.
          # GITHUB_SHA is the PR's merge commit under pull_request and main under pull_request_target.
          template="$RUNNER_TEMP/pull_request_template.md"
          if [[ "$DRAFT" != true ]]; then
            if ! gh api "repos/$GH_REPO/contents/.github/pull_request_template.md?ref=$GITHUB_SHA" \
                -H "Accept: application/vnd.github.raw" > "$template" \
              || ! template_problems=$(python3 - "$template" <<'EOF'
          import os, re, sys

          def strip(text):
              return re.sub(r"<!--.*?-->", "", text, flags=re.S)

          def sections(text):
              parts = re.split(r"^##[ \t]+(.+?)[ \t]*$", text, flags=re.M)
              return {parts[i].strip().lower(): parts[i + 1].strip() for i in range(1, len(parts) - 1, 2)}

          # The template is the only source of truth: its headings must all be present and filled,
          # and none of its own lines may be left unchanged (the link check above covers `Fixes #N`).
          template = strip(open(sys.argv[1], encoding="utf-8").read())
          body = strip(os.environ.get("PR_BODY") or "")
          found = sections(body)
          for name in re.findall(r"^##[ \t]+(.+?)[ \t]*$", template, flags=re.M):
              text = found.get(name.lower())
              if text is None:
                  print(f'Add the "## {name}" section.')
              elif not text:
                  print(f'Fill in the "{name}" section.')
          body_lines = {line.strip() for line in body.splitlines()}
          for line in template.splitlines():
              line = line.strip()
              if line and not line.startswith("##") and "Fixes #N" not in line and line in body_lines:
                  print(f'Replace or fill in the template line "{line}".')
          for box in re.findall(r"^\s*- \[ \] (.+?)\s*$", template, flags=re.M):
              if not re.search(r"^\s*- \[[xX]\] " + re.escape(box) + r"\s*$", body, flags=re.M):
                  print(f'Tick the checklist box "{box}".')
          if found.get("risk") and not re.match(r"[*_]*(Low|Medium|High)\b", found["risk"]):
              print("Start the Risk section with Low, Medium or High.")
          EOF
              ); then
              # A template check that could not run must not read as a clean body.
              problem "The template check could not run; see the workflow run."
            elif [[ -n "$template_problems" ]]; then
              problem "$template_problems"
            fi
          fi

          # The bot's last comment on the PR is this reminder: no other workflow comments.
          label=needs-issue
          problems=${problems%$'\n'}
          if [[ -n "$problems" ]]; then
            list=$(printf '%s' "$problems" | sed 's/^/- /')
            while IFS= read -r line; do echo "::warning::$line"; done <<< "$problems"
            gh label create "$label" --color FBCA04 --description "PR body is missing its issue link or a template section" 2> /dev/null
            gh api "repos/$GH_REPO/issues/$NUMBER/labels" -f "labels[]=$label" --silent
            gh pr comment "$NUMBER" --edit-last --create-if-none --body "$(printf '%s\n' \
              "Before review, this PR still needs:" "" "$list" "" \
              "This comment updates itself, and goes away with the \`$label\` label once the body is fixed. See CONTRIBUTING.md.")"
            printf '### Still needed\n%s\n' "$list" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$LABELLED" == true ]]; then
            gh api -X DELETE "repos/$GH_REPO/issues/$NUMBER/labels/$label" --silent
            gh pr comment "$NUMBER" --delete-last --yes
            echo "Issue link and template are in order now." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Issue link and template are in order." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
