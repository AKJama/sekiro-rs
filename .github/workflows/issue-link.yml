name: Issue link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]

permissions: { issues: read, pull-requests: read, contents: read }

jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check linked issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() {
            echo "Error: $* See CONTRIBUTING.md."
            exit 1
          }

          references=$(printf '%s\n' "$PR_BODY" | grep -Eio '\b(Fixes|Closes|Resolves)[[:blank:]]+#[0-9]+\b' || true)
          [[ -n "$references" ]] || fail "Include a closing issue reference such as Fixes #123 in the PR body."
          numbers=$(printf '%s\n' "$references" | grep -Eo '[0-9]+' | sort -u)
          [[ $(wc -l <<< "$numbers") -eq 1 ]] || fail "One issue per PR: this PR closes $(echo $numbers | sed 's/ /, #/g; s/^/#/'). Split it into one PR per issue."

          while IFS= read -r number; do
            issue=$(gh api "repos/$REPO/issues/$number") || fail "Could not read issue #$number."
            jq -e 'has("pull_request") | not' <<< "$issue" > /dev/null || fail "#$number is a PR, not an issue."
            jq -e '.state == "open"' <<< "$issue" > /dev/null || fail "Issue #$number must be open."
          done <<< "$numbers"
          echo "Linked issues are open: $(echo $numbers)."

      # Drafts are claims and may be empty; the template is checked once the PR is ready.
      - name: Check the PR follows the template
        if: ${{ !github.event.pull_request.draft }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import os, re, sys

          SECTIONS = ["Motivation", "What changed", "How it was tested", "Risk",
                      "New dependencies", "Checklist", "Screenshots / video", "Open"]
          PLACEHOLDERS = ["N findings, M fixed", "pass (N passed)", "pass / not affected"]

          body = re.sub(r"<!--.*?-->", "", os.environ.get("PR_BODY") or "", flags=re.S)
          parts = re.split(r"^##[ \t]+(.+?)[ \t]*$", body, flags=re.M)
          found = {parts[i].strip(): parts[i + 1].strip() for i in range(1, len(parts) - 1, 2)}
          errors = []
          for name in SECTIONS:
              if name not in found:
                  errors.append(f'Missing the "## {name}" section.')
              elif not found[name]:
                  errors.append(f'The "{name}" section is empty.')
          if found.get("Risk") and not re.match(r"(Low|Medium|High)\b", found["Risk"]):
              errors.append('Risk must start with Low, Medium or High.')
          for text in PLACEHOLDERS:
              if text in body:
                  errors.append(f'Replace the template text "{text}" with real results.')
          for line in body.splitlines():
              if re.match(r"\s*- (New tests|Live game|Agent and model used):\s*$", line) or \
                 re.match(r"\s*What to check when playing:\s*$", line):
                  errors.append(f'Fill in "{line.strip()}".')
          if re.search(r"^\s*- \[ \]", body, flags=re.M):
              errors.append("Tick every checklist box, or explain in the PR why one does not apply and tick it.")
          for e in errors:
              print(f"Error: {e}")
          if errors:
              print("Use the PR template, see CONTRIBUTING.md.")
              sys.exit(1)
          print("PR body follows the template.")
          EOF
