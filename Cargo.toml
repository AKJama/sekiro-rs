[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sekiro-formats = { path = "crates/formats" }
sekiro-sim = { path = "crates/sim" }
anyhow = "1"
thiserror = "2"
byteorder = "1"
flate2 = "1"
aes = "0.8"
num-bigint = "0.4"
libloading = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
glam = { version = "0.32", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
memmap2 = "0.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
